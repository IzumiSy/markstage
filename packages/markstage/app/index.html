<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markstage</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; }
      html {
        --ms-bg: #ffffff;
        --ms-fg: #1a1a1a;
        --ms-fg-muted: #888888;
        --ms-border: #e5e5e5;
        --ms-sidebar-active: #f0f0f0;
        --ms-code-bg: #f5f5f5;
      }
      @media (prefers-color-scheme: dark) {
        html {
          --ms-bg: #1a1a1a;
          --ms-fg: #e5e5e5;
          --ms-fg-muted: #777777;
          --ms-border: #333333;
          --ms-sidebar-active: #2a2a2a;
          --ms-code-bg: #2a2a2a;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
